# Define the events block to avoid nginx configuration errors
# empty because its default settings are sufficient for this setup
events {}

# Define the HTTP server configuration to handle HTTPS requests and web traffic
http {
    # Imports standard MIME type definitions (tells NGINX how to handle different file types)
    include /etc/nginx/mime.types;
    # if file type is unknown, use this default (binary stream) 
    default_type application/octet-stream;

    # Define a server block to handle incoming requests
    server {
        listen 443 ssl;  # Listen on port 443 for SSL/TLS connections
        server_name localhost;  # Server name (domain)

        # ssl configuration
        #  Points to the public certificate we created in the Dockerfile
        ssl_certificate /etc/ssl/certs/inception.crt;

        # Points to the private key we created in the Dockerfile
        ssl_certificate_key /etc/ssl/private/inception.key;

        # Security: Only allows modern, secure TLS versions 
        # (disables old, insecure SSLv3/TLSv1.0/TLSv1.1)
        ssl_protocols TLSv1.2 TLSv1.3;

        root /var/www/html;  # Document root for serving files
        index index.php index.html index.htm;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}